<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mechonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="mechonGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e2438" stroke-width="8"/>

  <!-- Geometric Mechon Matrix Structure -->
  <g transform="translate(256, 256)">
    <!-- Outer Hexagonal Frame -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" 
             fill="none" stroke="#252b42" stroke-width="8" stroke-linejoin="round" />

    <!-- Isometric Data Facets -->
    <!-- Top-Right Facet -->
    <path d="M0,0 L140,-80 L140,0 L0,80 Z" fill="url(#mechonGrad1)" opacity="0.85" />
    <!-- Top-Left Facet -->
    <path d="M0,0 L-140,-80 L0,-160 L140,-80 Z" fill="#3b82f6" opacity="0.95" />
    <!-- Bottom-Left Facet -->
    <path d="M0,0 L-140,-80 L-140,0 L0,80 Z" fill="url(#mechonGrad2)" opacity="0.9" />

    <!-- Center Crystalline Core (Convergence Point) -->
    <circle cx="0" cy="0" r="28" fill="#ffffff" />
    <circle cx="0" cy="0" r="14" fill="#06b6d4" />

    <!-- Data Axis Vertices -->
    <circle cx="0" cy="-160" r="10" fill="#06b6d4" />
    <circle cx="140" cy="-80" r="10" fill="#3b82f6" />
    <circle cx="140" cy="80" r="10" fill="#6366f1" />
    <circle cx="0" cy="160" r="10" fill="#06b6d4" />
    <circle cx="-140" cy="80" r="10" fill="#3b82f6" />
    <circle cx="-140" cy="-80" r="10" fill="#6366f1" />
  </g>
</svg>
