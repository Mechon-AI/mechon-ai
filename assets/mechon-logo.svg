<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="32" fill="#0c0e14" />

  <!-- Logo Mark -->
  <g transform="translate(180, 180) scale(0.65)">
    <!-- Hexagonal Frame -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" 
             fill="none" stroke="#252b42" stroke-width="10" stroke-linejoin="round" />
    <!-- Facets -->
    <path d="M0,0 L140,-80 L140,0 L0,80 Z" fill="url(#logoGrad)" opacity="0.85" />
    <path d="M0,0 L-140,-80 L0,-160 L140,-80 Z" fill="#3b82f6" opacity="0.95" />
    <path d="M0,0 L-140,-80 L-140,0 L0,80 Z" fill="#06b6d4" opacity="0.9" />
    <!-- Center Core -->
    <circle cx="0" cy="0" r="28" fill="#ffffff" />
    <circle cx="0" cy="0" r="14" fill="#06b6d4" />
    <!-- Vertices -->
    <circle cx="0" cy="-160" r="12" fill="#06b6d4" />
    <circle cx="140" cy="-80" r="12" fill="#3b82f6" />
    <circle cx="140" cy="80" r="12" fill="#6366f1" />
    <circle cx="0" cy="160" r="12" fill="#06b6d4" />
    <circle cx="-140" cy="80" r="12" fill="#3b82f6" />
    <circle cx="-140" cy="-80" r="12" fill="#6366f1" />
  </g>

  <!-- Typography -->
  <text x="350" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="92" font-weight="900" fill="#f8fafc" letter-spacing="4">
    MECHON <tspan fill="#06b6d4">AI</tspan>
  </text>
  <text x="355" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="28" font-weight="500" fill="#94a3b8" letter-spacing="6">
    ENGINEER THE DATA. SHAPE THE INTELLIGENCE.
  </text>
</svg>
