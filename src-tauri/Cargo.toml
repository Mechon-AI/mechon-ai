[package]
name = "mechon-ai"
version = "1.0.0"
description = "Mechon AI — Native Cross-Platform Desktop Workstation for SFT and DPO Dataset Engineering"
authors = ["Mechon AI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
