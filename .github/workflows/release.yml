name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.2.7)'
        required: false
        default: 'v1.2.7'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Build Desktop Release Binary
        run: |
          cd src-tauri
          cargo build --release --locked --bin mechon-ai

      - name: Build Android Companion Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew testDebugUnitTest
          ./gradlew assembleRelease assembleDebug

      - name: Prepare Release Packages and Artifacts
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          mkdir -p release-dist/mechon-ai-${TAG_NAME}-linux-x86_64
          
          # Copy binary & assets
          cp src-tauri/target/release/mechon-ai release-dist/mechon-ai-${TAG_NAME}-linux-x86_64/
          cp packaging/arch/mechon-ai.desktop release-dist/mechon-ai-${TAG_NAME}-linux-x86_64/
          cp -r assets release-dist/mechon-ai-${TAG_NAME}-linux-x86_64/
          cp LICENSE README.md release-dist/mechon-ai-${TAG_NAME}-linux-x86_64/

          cd release-dist
          # 1. Create portable tarball
          tar -czvf mechon-ai-${TAG_NAME}-linux-x86_64.tar.gz mechon-ai-${TAG_NAME}-linux-x86_64/
          
          # 2. Standalone binary
          cp mechon-ai-${TAG_NAME}-linux-x86_64/mechon-ai mechon-ai-linux-x86_64
          
          # 3. Android Companion APKs
          if [ -f ../android/app/build/outputs/apk/release/app-release.apk ]; then
            cp ../android/app/build/outputs/apk/release/app-release.apk mechon-mobile-${TAG_NAME}.apk
          elif [ -f ../android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp ../android/app/build/outputs/apk/release/app-release-unsigned.apk mechon-mobile-${TAG_NAME}.apk
          elif [ -f ../android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp ../android/app/build/outputs/apk/debug/app-debug.apk mechon-mobile-${TAG_NAME}.apk
          fi

          if [ -f ../android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp ../android/app/build/outputs/apk/debug/app-debug.apk mechon-mobile-${TAG_NAME}-debug.apk
          fi

          # 4. Packaging manifests
          cp ../packaging/arch/PKGBUILD .
          cp ../packaging/arch/mechon-ai.desktop .
          
          # 5. Generate SHA-256 Checksums
          FILES_TO_HASH="mechon-ai-${TAG_NAME}-linux-x86_64.tar.gz mechon-ai-linux-x86_64 PKGBUILD mechon-ai.desktop"
          if [ -f "mechon-mobile-${TAG_NAME}.apk" ]; then
            FILES_TO_HASH="$FILES_TO_HASH mechon-mobile-${TAG_NAME}.apk"
          fi
          if [ -f "mechon-mobile-${TAG_NAME}-debug.apk" ]; then
            FILES_TO_HASH="$FILES_TO_HASH mechon-mobile-${TAG_NAME}-debug.apk"
          fi
          sha256sum $FILES_TO_HASH > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Mechon AI ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/mechon-ai-*-linux-x86_64.tar.gz
            release-dist/mechon-ai-linux-x86_64
            release-dist/mechon-mobile-*.apk
            release-dist/PKGBUILD
            release-dist/mechon-ai.desktop
            release-dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
