name: Android Companion CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build-and-test:
    name: Build & Test Android Companion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Verify Version Alignment (1.2.8)
        run: |
          grep 'versionName = "1.2.8"' android/app/build.gradle.kts || { echo "versionName mismatch"; exit 1; }
          grep 'versionCode = 128' android/app/build.gradle.kts || { echo "versionCode mismatch"; exit 1; }
          echo "Android Companion version 1.2.8 (128) verified."

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Validate 16 KB ELF Page Size Alignment
        run: |
          echo "Auditing packaged native shared libraries in debug APK..."
          SO_FILES=$(unzip -l android/app/build/outputs/apk/debug/*.apk | grep '\.so' || true)
          if [ -n "$SO_FILES" ]; then
            echo "Native libraries found in APK:"
            echo "$SO_FILES"
          else
            echo "Verified: Zero unaligned native libraries detected. APK is 100% 16 KB compatible."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechon-companion-v1.2.8-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
